apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-http
  namespace: irrah-lab
  labels:
    app.kubernetes.io/name: lab-http
    app.kubernetes.io/part-of: irrah-operational-lab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-http
  namespace: irrah-lab
  labels:
    app.kubernetes.io/name: lab-http
    app.kubernetes.io/part-of: irrah-operational-lab
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-http
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-http
        app.kubernetes.io/part-of: irrah-operational-lab
    spec:
      serviceAccountName: lab-http
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: irrah-lab-http:0.1.0
          # Local kind load only: no pull or implicit dependency on a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LAB_FAULT_LATENCY_MS
              value: "0"
            - name: LAB_FAULT_ERROR_PERCENT
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lab-http
  namespace: irrah-lab
  labels:
    app.kubernetes.io/name: lab-http
    app.kubernetes.io/part-of: irrah-operational-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab-http
  ports:
    - name: http
      port: 8080
      targetPort: http
